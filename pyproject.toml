[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card-sorter-testbed"
version = "0.8.17"
description = "Hexagonal architecture card sorting machine test bed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "opencv-python-headless>=4.8",
  "pillow>=10.0.0",
  "pygame>=2.5.0",
]

[project.optional-dependencies]
hardware = [
  "pyserial>=3.5",
  "gpiozero>=2.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
